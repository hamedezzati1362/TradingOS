name: Test, collect data and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'     # data refresh (GitHub may delay scheduled runs by several minutes)
  workflow_dispatch:
    inputs:
      alert_test:
        description: 'Send a test alert message (1 = yes)'
        required: false
        default: '0'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Collect market data
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEST: ${{ github.event.inputs.alert_test }}
        # The collector never fails the deploy: on total failure it falls back to the last published snapshot.
        run: node collector/collect.mjs public/data/snapshot.json https://hamedezzati1362.github.io/TradingOS/data/snapshot.json || echo "collector failed; deploying without fresh data"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
