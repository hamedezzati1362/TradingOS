name: Test, collect data and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'     # backup only; the Ticker workflow dispatches this every 15 minutes
  workflow_dispatch:
    inputs:
      alert_test:
        description: 'Test message: 1 = connection test, brief = morning brief now'
        required: false
        default: '0'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Load history branch
        run: |
          if git fetch -q --depth=1 origin history; then git worktree add -q -B history hist FETCH_HEAD; else git worktree add -q --orphan -b history hist; fi
      - name: Collect market data
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEST: ${{ github.event.inputs.alert_test }}
          HISTORY_DIR: hist
        # The collector never fails the deploy: on total failure it falls back to the last published snapshot.
        run: node collector/collect.mjs public/data/snapshot.json https://hamedezzati1362.github.io/TradingOS/data/snapshot.json || echo "collector failed; deploying without fresh data"
      - name: Save history
        run: |
          cd hist
          git config user.name "tradingos-bot"; git config user.email "tradingos-bot@users.noreply.github.com"
          git add -A && git commit -qm "history $(date -u +%FT%TZ)" && git push -q origin history || echo "no history change"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
